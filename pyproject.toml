[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cctv-event-analytics"
version = "0.1.0"
description = "A prototype CCTV event analytics backend"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.14.1",
    "PyYAML==6.0.1",
    "SQLAlchemy>=2.0,<2.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
